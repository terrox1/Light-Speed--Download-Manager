# CI — run the LSDM test suite and keep the repo honest.
# Triggered on every push and pull request to main.
# Builds installers for Windows, macOS, and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdm-windows-installer
          path: release/**/*.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run dist:mac

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdm-macos-app
          path: release/**/*.dmg

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app
        run: npm run dist:linux

      - name: Upload Linux app artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdm-linux-app
          path: release/**/*.AppImage

  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: lsdm-windows-installer
          path: release/windows

      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: lsdm-macos-app
          path: release/macos

      - name: Download Linux app
        uses: actions/download-artifact@v4
        with:
          name: lsdm-linux-app
          path: release/linux

      - name: Upload all installers to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
          body: |
            # Light Speed Download Manager Release ${{ github.ref_name }}
            
            ## 📦 Downloads
            
            ### Windows
            - `LSDM Setup.exe` - Windows Installer (64-bit)
            
            ### macOS
            - `LSDM.dmg` - macOS Application (Intel & Apple Silicon)
            
            ### Linux
            - `LSDM.AppImage` - Linux Executable (AppImage format)
            
            ## 🎯 Installation Instructions
            
            **Windows:**
            1. Download `LSDM Setup.exe`
            2. Double-click to run the installer
            3. Follow the setup wizard
            4. Launch LSDM from Start Menu
            
            **macOS:**
            1. Download `LSDM.dmg`
            2. Open the DMG file
            3. Drag LSDM to Applications folder
            4. Launch from Applications
            
            **Linux:**
            1. Download `LSDM.AppImage`
            2. Make it executable: `chmod +x LSDM.AppImage`
            3. Run: `./LSDM.AppImage`
            
            ## ✨ Features
            - ⚡ Fast and efficient download management
            - 🔄 Multi-threaded downloads
            - 📊 Real-time progress tracking
            - 💾 Resume capability
            - 🛡️ Error handling and recovery
            - 🚀 Cross-platform support
            
            ## 🐛 Bug Reports & Feature Requests
            Please open an issue on [GitHub Issues](https://github.com/terrox1/Light-Speed--Download-Manager/issues)
            
            Thank you for using LSDM! 🙏
