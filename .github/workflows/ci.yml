# CI — run the LSDM test suite and keep the repo honest.
# Triggered on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 43 requires Node >= 22.12 and the `node --test "tests/**/*.test.js"`
          # glob form needs Node 22+.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite covers the Node engine (server.js) verified on BOTH
      # Linux and Windows — proof the engine is portable.
      - name: Run tests
        run: npm test

  # Keep the packaged build honest too — Windows installer must build.
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
